[package]
name = "azanboki"
version = "0.1.0"
edition = "2024"
description = "A quiet, cross-platform Azan companion"
authors = ["Ehab Hussein"]
license = "MIT"
repository = "https://github.com/ehabhussein/AzanBoki"
homepage = "https://github.com/ehabhussein/AzanBoki"
keywords = ["adhan", "azan", "prayer-times", "desktop", "islam"]
categories = ["gui"]
publish = false
build = "build.rs"

[dependencies]
adhaan = { path = "vendor/adhaan" }
anyhow = "1"
auto-launch = "0.5"
directories = "6"
jiff = { version = "0.2", features = ["serde"] }
rfd = "0.15"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "vorbis", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.17"
thiserror = "2"

[build-dependencies]
slint-build = "1.17"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
